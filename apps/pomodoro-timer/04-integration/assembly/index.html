<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ポモドーロタイマー</title>
<link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <div id="app-root" class="app">
    <header class="app-header">
      <h1>ポモドーロタイマー</h1>
    </header>

    <nav class="tabs" role="tablist" aria-label="画面切り替え">
      <button
        type="button"
        role="tab"
        id="tab-timer"
        class="tabs__button"
        aria-controls="panel-timer"
        aria-selected="true"
        data-tab-target="timer"
      >タイマー</button>
      <button
        type="button"
        role="tab"
        id="tab-settings"
        class="tabs__button"
        aria-controls="panel-settings"
        aria-selected="false"
        tabindex="-1"
        data-tab-target="settings"
      >設定</button>
      <button
        type="button"
        role="tab"
        id="tab-session-log"
        class="tabs__button"
        aria-controls="panel-session-log"
        aria-selected="false"
        tabindex="-1"
        data-tab-target="session-log"
      >セッション記録</button>
    </nav>

    <!-- timer-core (FR-1) の表示・操作領域。id は timer-core/src/main.js の
         mountTimerUI() がそのまま参照する契約上のIDなので変更しない。 -->
    <section
      id="panel-timer"
      class="tab-panel"
      role="tabpanel"
      aria-labelledby="tab-timer"
      data-tab-panel="timer"
    >
      <p id="timer-error" class="error" role="alert" hidden></p>

      <div class="timer-card" aria-live="polite">
        <p class="timer-card__session-type" id="timer-session-type" data-session="WORK">作業</p>
        <p class="timer-card__remaining" id="timer-remaining">25:00</p>
        <p class="timer-card__cycle" id="timer-cycle">完了した作業セッション: 0</p>
      </div>

      <div class="timer-card__controls">
        <button id="timer-start" type="button">開始</button>
        <button id="timer-pause" type="button" disabled>一時停止</button>
        <button id="timer-resume" type="button" disabled>再開</button>
        <button id="timer-reset" type="button">リセット</button>
      </div>
    </section>

    <!-- settings (FR-2) の表示・操作領域。settings/src/ui.js の mountSettingsForm() を
         この空コンテナに integrator がマウントする。 -->
    <section
      id="panel-settings"
      class="tab-panel"
      role="tabpanel"
      aria-labelledby="tab-settings"
      data-tab-panel="settings"
      hidden
    >
      <p class="settings-intro">
        作業時間・休憩時間・通知音を変更できます。保存すると次回のセッションから反映されます。
      </p>
      <div id="settings-root"></div>
    </section>

    <!-- session-log (FR-3) の表示・操作領域。data-session-log-* は
         session-log/src/ui.js の queryElements() が参照する契約上の属性なので変更しない。 -->
    <section
      id="panel-session-log"
      class="tab-panel"
      role="tabpanel"
      aria-labelledby="tab-session-log"
      data-tab-panel="session-log"
      hidden
    >
      <div data-session-log-storage-error hidden role="alert"></div>

      <div class="summary">
        <div class="summary__stat">
          <span class="summary__stat-value" data-session-log-total-count>0</span>
          <span class="summary__stat-label">全件数</span>
        </div>
        <div class="summary__stat">
          <span class="summary__stat-value" data-session-log-today-count>0</span>
          <span class="summary__stat-label">本日の完了件数</span>
        </div>
      </div>

      <ul class="session-log__list" data-session-log-records aria-live="polite"></ul>

      <div class="actions">
        <button type="button" class="button--secondary" data-session-log-clear>
          全件クリア
        </button>
      </div>
    </section>
  </div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
