# 全機能が依存してよい最小限の共有契約（DDD でいう Shared Kernel）。
# ここに置くものは変更コストが高いことを認識し、本当に全機能共通のものだけに限定する。
app_id: "pomodoro-timer"
version: 1
# common_types はあえて空にしている。timer_settings（settings→timer-core）や
# work_session_completed（timer-core→session-log）は producer/consumer の2機能間だけで
# 使われる型であり、「全機能が共通で必要とするもの」ではない。これらの形は各機能の
# contract.yaml の inputs/outputs（json_schema）と architecture.machine.yaml の
# interfaces[] だけで表現し、shared-kernel には型として複製しない（6節）。
common_types: []
# このアプリは非機能要件・制約により認証を持たない（requirements.machine.yaml の non_goals）。
auth: {}
# 3機能のうち settings と session-log がそれぞれ独立に永続化を必要とし、将来
# 追加される機能があっても同じ方針に従うべき「DB方針」に相当するため、ここに共通化する。
# 具体的なキー名・レコード形状は各機能の contract.yaml が個別に定義する（ここでは方針のみ）。
data_store:
  policy: >-
    バックエンドを持たない構成のため、永続化が必要な機能はブラウザの localStorage のみを使う。
    キーは `pomodoro-timer:<domain>:v<n>` の形式で名前空間化する（例:
    `pomodoro-timer:settings:v1`, `pomodoro-timer:session-records:v1`）。値は
    JSON.stringify した文字列として保存する。保存するデータ構造を変更する場合はキー末尾の
    バージョン番号を上げ、旧バージョンのキーは読み捨てて既定値にフォールバックする
    （マイグレーション処理は持たない）。localStorage が利用不可、または読み書きに失敗した
    場合はエラーを握りつぶさず、各機能はメモリ内の既定値で動作を継続し、アプリ全体を
    クラッシュさせない。
# solution-architect が設計時にユーザーへ確認し、プラグインとして追加インストールが必要な
# Skill（デザイン系・専門的なルール集など）を使うと決めたらここに列挙する。ここに書かれた
# Skill は「実装フェーズの必須要件」になる。feature-builder は実装開始前に、各 plugin_ref が
# 有効化されているか Hook で機械的に検証され、欠けていればブロックされる
# （harness/CONVENTIONS.md 10節参照）。Claude Code 標準搭載の security-review/code-review は
# ここに含めない（常時利用可能という前提のため）。
#
# 本アプリはフレームワーク不要のシンプルな Vanilla JS 構成であり、UI も最低限の3画面
# （タイマー・設定・記録一覧）に留まる。harness/quality/design-baseline.md（Layer 1）を
# feature-builder/integrator が実装・結線時に読むだけで最低限の品質は担保できると判断し、
# デザイン系プラグイン Skill 等の追加インストールは行わない。実装中に必要性が明確になった
# 場合は diff-design で設計に立ち返って追加を検討すること。
required_skills: []
notes: >-
  このアプリは apparness ハーネス自体の「機能の疎結合な分割」を検証する試験用アプリのため、
  shared-kernel は意図的に薄く保っている。3機能はいずれも interfaces[] 経由のイベント/値の
  受け渡しだけで連携し、内部実装（DOM構造・状態管理の方法など）はここに一切含めない。
