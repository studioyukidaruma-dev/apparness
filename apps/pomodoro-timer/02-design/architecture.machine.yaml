# schema: harness/schemas/architecture.schema.json
# features[] は互いに depends_on を持たない。つながりは interfaces[] でのみ表現する。
app_id: "pomodoro-timer"
design_version: 1
based_on_requirements_version: 1
status: APPROVED
shared_kernel_ref: "../01-foundation/shared-kernel.yaml"
features:
  - id: "timer-core"
    name: "タイマー本体"
    description: >-
      作業/短い休憩/長い休憩セッションを設定に沿ってカウントダウンし、作業セッション数に
      応じて自動的に休憩種別を切り替える中核ロジック。開始/一時停止/再開/リセット操作を
      提供する（FR-1に対応）。settings機能から timer_settings を受け取り、作業セッション
      完了時に work_session_completed イベントを出力する以外、他機能の内部実装を知らない。
    contract_ref: "features/timer-core.contract.yaml"
    status_ref: "../03-features/timer-core/status.yaml"
    tech_stack:
      language: "JavaScript (ES2022, native ES Modules)"
      framework: ""
      libraries:
        - name: "vitest"
          version: "^4.1"
          license: "MIT"
          notes: "devDependency。カウントダウン/自動切替ロジックの単体テスト専用。"
  - id: "settings"
    name: "設定"
    description: >-
      作業時間・短い休憩時間・長い休憩時間・長い休憩までの作業セッション数・通知音ON/OFFを
      ユーザーが編集できる設定画面（FR-2に対応）。入力値を検証し localStorage に永続化する。
      検証済みの値を timer_settings として timer-core に提供する以外、timer-core が
      それをいつ・どう使うかには関知しない。
    contract_ref: "features/settings.contract.yaml"
    status_ref: "../03-features/settings/status.yaml"
    tech_stack:
      language: "JavaScript (ES2022, native ES Modules)"
      framework: ""
      libraries:
        - name: "vitest"
          version: "^4.1"
          license: "MIT"
          notes: "devDependency。入力検証ロジックの単体テスト専用。"
  - id: "session-log"
    name: "セッション記録"
    description: >-
      完了した作業セッションを日時・所要時間とともに記録し、一覧・件数を表示する
      （FR-3に対応）。timer-core が出力する work_session_completed イベントを受け取り
      localStorageに永続化する。イベントがどう生成されたか（カウントダウンの内部状態等）
      には一切関知しない。
    contract_ref: "features/session-log.contract.yaml"
    status_ref: "../03-features/session-log/status.yaml"
    tech_stack:
      language: "JavaScript (ES2022, native ES Modules)"
      framework: ""
      libraries:
        - name: "vitest"
          version: "^4.1"
          license: "MIT"
          notes: "devDependency。記録追加/集計/全件クリアロジックの単体テスト専用。"
interfaces:
  - producer_feature: "settings"
    producer_output: "timer_settings"
    consumer_feature: "timer-core"
    consumer_input: "timer_settings"
  - producer_feature: "timer-core"
    producer_output: "work_session_completed"
    consumer_feature: "session-log"
    consumer_input: "work_session_completed"
superseded_by: null
