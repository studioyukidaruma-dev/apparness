<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>セッション記録（session-log 単体確認用）</title>
  <style>
    :root {
      --bg: #1b1614;
      --surface: #241d1a;
      --surface-raised: #2e2521;
      --border: #40332c;
      --text: #f5efe9;
      --text-muted: #c9bdb4;
      --accent: #ff7a63;
      --accent-strong: #ff6347;
      --accent-text: #1b1614;
      --focus-ring: #ffb4a3;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 16px;
      --space-4: 24px;
      --space-5: 32px;
      --space-6: 48px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "Hiragino Sans", "Yu Gothic UI", "Segoe UI", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }

    main {
      max-width: 640px;
      margin: 0 auto;
      padding: var(--space-5) var(--space-3) var(--space-6);
    }

    header {
      margin-bottom: var(--space-5);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 var(--space-1);
    }

    p.lede {
      color: var(--text-muted);
      margin: 0;
      font-size: 0.9375rem;
    }

    section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--space-2);
      padding: var(--space-4);
      margin-bottom: var(--space-4);
    }

    section h2 {
      font-size: 1rem;
      font-weight: 700;
      margin: 0 0 var(--space-3);
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .summary {
      display: flex;
      gap: var(--space-4);
    }

    .summary__stat {
      flex: 1;
      background: var(--surface-raised);
      border-radius: var(--space-2);
      padding: var(--space-3);
      text-align: center;
    }

    .summary__stat-value {
      display: block;
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.2;
    }

    .summary__stat-label {
      display: block;
      margin-top: var(--space-1);
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .session-log__list {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 320px;
      overflow-y: auto;
    }

    .session-log__item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--space-2) var(--space-2);
      border-bottom: 1px solid var(--border);
    }

    .session-log__item:last-child {
      border-bottom: none;
    }

    .session-log__item-time {
      color: var(--text);
    }

    .session-log__item-duration {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      font-weight: 700;
    }

    .session-log__empty {
      color: var(--text-muted);
      padding: var(--space-4) var(--space-2);
      text-align: center;
    }

    [data-session-log-storage-error] {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      background: #3a1f1a;
      border: 1px solid var(--accent-strong);
      color: #ffd8cf;
      padding: var(--space-3);
      border-radius: var(--space-2);
      margin-bottom: var(--space-3);
      font-size: 0.9375rem;
    }

    [data-session-log-storage-error]::before {
      content: "\26A0";
      font-size: 1.1rem;
    }

    [data-session-log-storage-error][hidden] {
      display: none;
    }

    .actions {
      display: flex;
      gap: var(--space-3);
      flex-wrap: wrap;
      align-items: center;
    }

    button {
      font: inherit;
      font-weight: 700;
      min-height: 44px;
      min-width: 44px;
      padding: var(--space-2) var(--space-4);
      border-radius: var(--space-2);
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
    }

    button:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .button--primary {
      background: var(--accent);
      color: var(--accent-text);
    }

    .button--primary:hover {
      background: var(--accent-strong);
    }

    .button--primary:active {
      background: #e0543f;
    }

    .button--secondary {
      background: transparent;
      color: var(--accent);
      border-color: var(--accent);
    }

    .button--secondary:hover {
      background: rgba(255, 122, 99, 0.12);
    }

    .button--secondary:active {
      background: rgba(255, 122, 99, 0.2);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    label {
      display: inline-flex;
      flex-direction: column;
      gap: var(--space-1);
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    input[type="number"] {
      font: inherit;
      min-height: 44px;
      padding: var(--space-2);
      border-radius: var(--space-2);
      border: 1px solid var(--border);
      background: var(--surface-raised);
      color: var(--text);
      width: 96px;
    }

    input[type="number"]:focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 2px;
    }

    .demo-note {
      font-size: 0.8125rem;
      color: var(--text-muted);
      margin-top: var(--space-3);
    }

    @media (max-width: 400px) {
      .summary {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>セッション記録</h1>
      <p class="lede">完了した作業セッションの記録・一覧表示・全件クリア（session-log 機能）</p>
    </header>

    <div data-session-log-storage-error hidden role="alert"></div>

    <section aria-labelledby="summary-heading">
      <h2 id="summary-heading">件数サマリ</h2>
      <div class="summary">
        <div class="summary__stat">
          <span class="summary__stat-value" data-session-log-total-count>0</span>
          <span class="summary__stat-label">全件数</span>
        </div>
        <div class="summary__stat">
          <span class="summary__stat-value" data-session-log-today-count>0</span>
          <span class="summary__stat-label">本日の完了件数</span>
        </div>
      </div>
    </section>

    <section aria-labelledby="records-heading">
      <h2 id="records-heading">記録一覧</h2>
      <ul class="session-log__list" data-session-log-records aria-live="polite"></ul>
      <div class="actions" style="margin-top: var(--space-3);">
        <button type="button" class="button--secondary" data-session-log-clear>
          全件クリア
        </button>
      </div>
    </section>

    <section aria-labelledby="simulate-heading">
      <h2 id="simulate-heading">動作確認用: イベント注入</h2>
      <div class="actions">
        <label for="simulate-duration">
          所要時間（分）
          <input type="number" id="simulate-duration" data-simulate-duration min="1" step="1" value="25" />
        </label>
        <button type="button" class="button--primary" data-simulate-completed>
          work_session_completed を発生させる
        </button>
      </div>
      <p class="demo-note">
        本番では timer-core からのイベントを integrator が結線します。
        ここでは単体確認のため、このボタンで同等のイベントを直接注入します。
      </p>
    </section>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
