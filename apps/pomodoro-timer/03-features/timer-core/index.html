<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>timer-core 単体確認</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1b1b1f;
    --card-bg: #242429;
    --text: #f5f5f2;
    --text-muted: #b5b5bd;
    --work-accent: #c13a2e;
    --work-accent-hover: #d4453a;
    --work-accent-active: #a52f25;
    --break-accent: #2f7a5c;
    --break-accent-hover: #38916d;
    --break-accent-active: #23604a;
    --neutral-btn: #35353c;
    --neutral-btn-hover: #40404a;
    --border: #3a3a42;
    --focus-ring: #f2c14e;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Kaku Gothic ProN", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    padding: 16px;
  }

  main {
    width: 100%;
    max-width: 420px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 24px;
    display: flex;
    flex-direction: column;
    gap: 24px;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
    color: var(--text-muted);
    text-align: center;
    letter-spacing: 0.02em;
  }

  .session-type {
    text-align: center;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--work-accent-hover);
  }

  .session-type[data-session="SHORT_BREAK"],
  .session-type[data-session="LONG_BREAK"] {
    color: var(--break-accent-hover);
  }

  .remaining {
    text-align: center;
    font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    font-size: 64px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 8px 0;
  }

  .cycle {
    text-align: center;
    font-size: 14px;
    color: var(--text-muted);
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  button {
    appearance: none;
    border: none;
    border-radius: 8px;
    min-width: 88px;
    min-height: 44px;
    padding: 8px 16px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    color: var(--text);
    background: var(--neutral-btn);
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  button:hover:not(:disabled) { background: var(--neutral-btn-hover); }
  button:active:not(:disabled) { transform: translateY(1px); }

  button:focus-visible {
    outline: 3px solid var(--focus-ring);
    outline-offset: 2px;
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  #timer-start {
    background: var(--work-accent);
  }
  #timer-start:hover:not(:disabled) { background: var(--work-accent-hover); }
  #timer-start:active:not(:disabled) { background: var(--work-accent-active); }

  #timer-resume {
    background: var(--break-accent);
  }
  #timer-resume:hover:not(:disabled) { background: var(--break-accent-hover); }
  #timer-resume:active:not(:disabled) { background: var(--break-accent-active); }

  .error {
    background: #4a1f1c;
    border: 1px solid #b3392c;
    color: #ffd7d2;
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 14px;
  }

  .error::before {
    content: "\26A0 ";
  }

  @media (max-width: 400px) {
    .remaining { font-size: 52px; }
  }
</style>
</head>
<body>
  <main>
    <h1>Pomodoro Timer &mdash; timer-core 単体確認用</h1>

    <p id="timer-error" class="error" role="alert" hidden></p>

    <div aria-live="polite">
      <p class="session-type" id="timer-session-type" data-session="WORK">作業</p>
      <p class="remaining" id="timer-remaining">25:00</p>
      <p class="cycle" id="timer-cycle">完了した作業セッション: 0</p>
    </div>

    <div class="controls">
      <button id="timer-start" type="button">開始</button>
      <button id="timer-pause" type="button" disabled>一時停止</button>
      <button id="timer-resume" type="button" disabled>再開</button>
      <button id="timer-reset" type="button">リセット</button>
    </div>
  </main>

  <script type="module">
    import { mountTimerUI } from "./src/main.js";
    mountTimerUI(document);
  </script>
</body>
</html>
