# schema: harness/schemas/feature-contract.schema.json
# この機能の入出力の唯一の情報源。担当者はこのファイルと SPEC.md だけを見れば実装できる。
# CONTRACT_APPROVED 以降は harness/hooks/pre_tool_use_guard.py により書き込みが凍結される。
feature_id: "timer-core"
feature_name: "タイマー本体"
version: 1
description: >-
  作業・短い休憩・長い休憩の各セッションを、与えられた設定値に沿ってカウントダウンし、
  作業セッション数に応じて短い休憩／長い休憩を自動的に切り替える中核ロジック。
  開始・一時停止・再開・リセットの操作を受け付け、残り時間・現在のセッション種別を
  常に画面表示する。作業セッションが1件完了するたびに完了イベントを出力する。
  設定値・記録の永続化方法は一切知らない（settings / session-log の内部実装には関知しない）。
inputs:
  - name: "timer_settings"
    json_schema:
      type: object
      additionalProperties: false
      required:
        - work_minutes
        - short_break_minutes
        - long_break_minutes
        - sessions_until_long_break
        - sound_enabled
      properties:
        work_minutes: { type: integer, minimum: 1, maximum: 180 }
        short_break_minutes: { type: integer, minimum: 1, maximum: 60 }
        long_break_minutes: { type: integer, minimum: 1, maximum: 60 }
        sessions_until_long_break: { type: integer, minimum: 1, maximum: 12 }
        sound_enabled: { type: boolean }
    required: true
    description: >-
      現在有効なタイマー設定値。settings機能が出力する timer_settings をそのまま受け取る
      （interfaces[] 参照）。設定変更は進行中のセッションには即時反映せず、次にセッションが
      開始またはリセットされたタイミングで読み込む。
    example:
      work_minutes: 25
      short_break_minutes: 5
      long_break_minutes: 15
      sessions_until_long_break: 4
      sound_enabled: true
  - name: "user_command"
    json_schema:
      type: string
      enum: ["start", "pause", "resume", "reset"]
    required: true
    description: >-
      この機能自身のUI（開始/一時停止/再開/リセットボタン）から発生する操作。
      他機能からは渡されない、この機能内で完結する入力。
    example: "start"
outputs:
  - name: "timer_display_state"
    json_schema:
      type: object
      required:
        - session_type
        - remaining_seconds
        - is_running
        - completed_work_sessions_in_cycle
      properties:
        session_type: { type: string, enum: ["WORK", "SHORT_BREAK", "LONG_BREAK"] }
        remaining_seconds: { type: integer, minimum: 0 }
        is_running: { type: boolean }
        completed_work_sessions_in_cycle: { type: integer, minimum: 0 }
    description: >-
      画面表示用の現在状態（MM:SS表示・現在のセッション種別・実行中かどうか等）。
      この機能自身のUI表示にのみ使う内部出力で、他機能には渡さない。
    example:
      session_type: "WORK"
      remaining_seconds: 1490
      is_running: true
      completed_work_sessions_in_cycle: 1
  - name: "work_session_completed"
    json_schema:
      type: object
      additionalProperties: false
      required: ["completed_at", "duration_seconds", "session_type"]
      properties:
        completed_at: { type: string, format: date-time }
        duration_seconds: { type: integer, minimum: 1 }
        session_type: { type: string, const: "WORK" }
    description: >-
      作業セッションが1件完了するたびに1回だけ発火するイベント。session-log機能が
      記録として消費する（interfaces[] 参照）。休憩セッション（短い/長い）が完了しても
      このイベントは出力しない（FR-3: 休憩は記録対象外）。
    example:
      completed_at: "2026-08-20T09:30:00Z"
      duration_seconds: 1500
      session_type: "WORK"
side_effects:
  - "残り時間が0に到達したとき、timer_settings.sound_enabled が true なら通知音を再生する"
  - "実行中は1秒ごとに timer_display_state を再計算し画面表示を更新する"
error_cases:
  - code: "INVALID_SETTINGS"
    condition: "timer_settings が必須項目を欠く、または各項目が定義範囲外の値を含む"
    response_shape: { type: object }
  - code: "COMMAND_IGNORED"
    condition: "現在の状態で意味を持たない操作を受け取った（例: 停止中に pause、既に実行中に resume）。エラーとしてではなく無視して現状を維持する。"
    response_shape: { type: object }
tech_stack:
  language: "JavaScript (ES2022, native ES Modules)"
  framework: ""
  libraries:
    - name: "vitest"
      version: "^4.1"
      license: "MIT"
      notes: >-
        開発時のユニットテスト専用（devDependency）。本番の静的配信物には含めない。
        カウントダウン・自動切替・コマンド受理判定を DOM から独立した純粋関数として実装し、
        vitestで単体テストする。2026年8月時点でnpm上の最新版が直近1か月以内に公開されており
        活発にメンテナンスされていることを確認済み。既知の重大な脆弱性報告なし。
non_functional:
  precision: >-
    25分程度のセッションで表示のずれを数秒以内に収める。setInterval のコールバック間隔の
    累積誤差を避けるため、開始時刻(Date.now())との差分から毎回 remaining_seconds を
    再計算する方式にする。
  accessibility: >-
    開始/一時停止/再開/リセットは button 要素で実装しキーボード操作可能にする。
    現在のセッション種別と残り時間は aria-live 領域に置き、変化をスクリーンリーダーで
    読み上げ可能にする。
test_strategy: >-
  カウントダウン計算・セッション自動切替・コマンド受理判定のロジックをDOM操作から
  分離した純粋関数/クラスとして実装し、vitestで単体テストする（例: N回作業完了後に
  長い休憩へ切り替わるか、pause中はカウントが進まないか等）。DOM結合部分・音声再生は
  自動テスト対象外とし手動確認で補う。
created_at: null
approved_at: null
approved_by: null
