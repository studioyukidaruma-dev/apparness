# schema: harness/schemas/requirements.schema.json
# 人間向けの requirements.md と内容を一致させること
app_id: "pomodoro-timer"
app_name: "ポモドーロタイマー"
version: 1
status: APPROVED
summary: >-
  ブラウザ上で動作する、認証や外部API連携を持たないシンプルなポモドーロタイマー。
  作業時間と休憩時間を交互にカウントダウンし、ユーザーが自分のペースに合わせて
  時間設定をカスタマイズでき、完了した作業セッションの履歴を確認できる。
  apparnessハーネス自体の「機能が疎結合に分割され、それぞれ独立に完成できるか」を
  検証するための試験用アプリという位置づけも兼ねる。
goals:
  - ポモドーロテクニック（作業/休憩を交互に繰り返す時間管理手法）に沿ったカウントダウンタイマーを提供する。
  - ユーザーが作業時間・休憩時間などのパラメータを自分好みにカスタマイズできるようにする。
  - 完了した作業セッションを記録し、後から達成状況を振り返れるようにする。
  - タイマー本体・設定・セッション記録が互いの内部実装を知らずに独立して作成でき、組み合わせても
    正しく動くという設計原則を検証できる規模・粒度の要件にとどめる。
non_goals:
  - ユーザー登録・ログイン・認証機能は提供しない。
  - サーバーサイドでのデータ保存や複数端末間でのデータ同期は行わない（永続化はブラウザのlocalStorage等クライアント内に限定）。
  - タスク管理・カレンダー連携・チームでの共同作業機能は提供しない。
  - ネイティブモバイルアプリ・デスクトップアプリとしての配布は行わない（ブラウザで動くWebアプリのみ）。
  - 外部API（天気・音楽配信・分析サービス等）との連携は行わない。
target_users:
  - 学習や仕事で作業に集中する時間を区切って管理したい個人ユーザー。
  - ポモドーロテクニックを初めて試してみたい初心者ユーザー。
  - （副次的に）本アプリを題材にapparnessハーネスの機能分割の妥当性を検証する開発者。
functional_requirements:
  - id: FR-1
    title: タイマー本体（カウントダウン・セッション進行）
    description: >-
      作業セッションと休憩セッション（短い休憩／長い休憩）を、設定された時間に沿って
      カウントダウンし、自動的に切り替えていく中核ロジック。開始・一時停止・再開・リセットの
      基本操作を提供する。
    priority: MUST
    acceptance_criteria:
      - "ユーザーは「開始」操作で現在のセッション（作業／休憩）のカウントダウンを開始できる。"
      - "残り時間はMM:SS形式で常に表示され、1秒ごとに更新される。"
      - "ユーザーはカウントダウン中に「一時停止」「再開」を行える。"
      - "ユーザーは現在のセッションを初期状態（設定時間）に「リセット」できる。"
      - "残り時間が0になると自動的にカウントダウンが停止し、セッション終了が視覚的にわかる形（表示の変化・任意で音）で通知される。"
      - "作業セッションが終わると自動的に休憩セッション（既定のセッション数ごとに短い休憩／長い休憩）に切り替わり、その逆も同様に切り替わる。"
      - "現在のセッション種別（作業／短い休憩／長い休憩）が画面上で常に判別できる。"
  - id: FR-2
    title: 設定（タイマーパラメータのカスタマイズ）
    description: >-
      作業時間・短い休憩時間・長い休憩時間・長い休憩までの作業セッション数・通知音のON/OFFなど、
      タイマーの挙動を決めるパラメータをユーザーが設定できる画面。設定値はブラウザ内に永続化される。
    priority: MUST
    acceptance_criteria:
      - "ユーザーは作業時間・短い休憩時間・長い休憩時間を分単位で設定できる。"
      - "ユーザーは何回の作業セッションごとに長い休憩を挟むかを設定できる。"
      - "ユーザーは通知音のON/OFFを設定できる。"
      - "設定値はページを再読み込みしても保持される（localStorage等での永続化）。"
      - "設定変更は、現在進行中のセッションには即時反映されず、次にセッションが開始（またはリセット）されたときから反映される。"
      - "設定画面に入力エラー（0以下や極端な値など）がある場合、不正な値のまま保存されない。"
  - id: FR-3
    title: セッション記録（完了した作業セッションの履歴）
    description: >-
      完了した作業セッションを日時・所要時間とともに記録し、一覧や件数としてユーザーが
      後から確認できるようにする機能。記録はブラウザ内に永続化される。
    priority: SHOULD
    acceptance_criteria:
      - "作業セッションが1回完了するたびに、完了日時と所要時間を含む記録が1件追加される。"
      - "ユーザーは記録の一覧（または本日の完了件数など要約）を画面上で確認できる。"
      - "記録はページを再読み込みしても保持される（localStorage等での永続化）。"
      - "ユーザーは記録を全件クリアできる。"
      - "休憩セッションは記録の対象としない。"
non_functional_requirements:
  - category: 実行環境
    description: 認証・サーバーサイド処理を持たない、ブラウザのみで完結する静的なフロントエンドWebアプリとして動作する。
  - category: 互換性
    description: 最新版のChrome・Firefox・Safari・Edgeで問題なく動作する。
  - category: データ永続化
    description: 設定値・セッション記録はブラウザのlocalStorage等クライアントサイドの仕組みで永続化し、バックエンドを必要としない。
  - category: 精度
    description: 25分程度のセッションにおいて、表示される残り時間のずれが数秒以内に収まる。
  - category: 操作性
    description: 開始・一時停止・リセットなど主要な操作はキーボードやスクリーンリーダーでも支障なく行える最低限の配慮をする。
constraints:
  - フロントエンドのみで実装し、バックエンドサーバー・データベース・外部APIには依存しない。
  - 静的ファイルとしてホスティング可能な構成にする（ビルド成果物を任意の静的ホスティングに配置できる）。
  - ユーザーアカウント・ログインの概念を持たない。
open_questions: []
