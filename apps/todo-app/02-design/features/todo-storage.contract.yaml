# schema: harness/schemas/feature-contract.schema.json
# この機能の入出力の唯一の情報源。担当者はこのファイルと SPEC.md だけを見れば実装できる。
# CONTRACT_APPROVED 以降は harness/hooks/pre_tool_use_guard.py により書き込みが凍結される。
feature_id: "todo-storage"
feature_name: "永続化アダプタ"
version: 1
description: >-
  ブラウザの localStorage への TodoItem 配列の読み書きのみを担うアダプタ機能。
  アプリ起動時に保存済みデータを読み込んで persisted_todo_list として出力し、
  他機能（todo-crud）から渡された最新の TodoItem 配列を受け取って保存する（FR-10）。
  localStorage のキー名・シリアライズ形式などの実装詳細はこの機能に閉じる。

inputs:
  - name: "todo_list_to_persist"
    json_schema:
      type: array
      items:
        type: object
        additionalProperties: false
        required: ["id", "title", "completed", "priority", "tags", "createdAt", "updatedAt"]
        properties:
          id: { type: string, format: uuid }
          title: { type: string, minLength: 1, maxLength: 200 }
          completed: { type: boolean }
          dueDate: { type: ["string", "null"], format: date }
          priority: { type: string, enum: ["high", "medium", "low"] }
          tags: { type: array, items: { type: string, minLength: 1 } }
          createdAt: { type: string, format: date-time }
          updatedAt: { type: string, format: date-time }
    required: true
    description: >-
      todo-crud が組み立てた最新の TodoItem 配列全体。変更のたびに配列全体が
      渡され、この機能はそのままの内容で保存領域を上書きする（差分更新ではない）。
    example:
      - id: "6f2a9a2e-5b8c-4b2b-9f9a-4a2b2c1e0001"
        title: "牛乳を買う"
        completed: false
        dueDate: "2026-08-20"
        priority: "medium"
        tags: ["買い物"]
        createdAt: "2026-08-19T09:00:00Z"
        updatedAt: "2026-08-19T09:00:00Z"

outputs:
  - name: "persisted_todo_list"
    json_schema:
      type: array
      items:
        type: object
        additionalProperties: false
        required: ["id", "title", "completed", "priority", "tags", "createdAt", "updatedAt"]
        properties:
          id: { type: string, format: uuid }
          title: { type: string, minLength: 1, maxLength: 200 }
          completed: { type: boolean }
          dueDate: { type: ["string", "null"], format: date }
          priority: { type: string, enum: ["high", "medium", "low"] }
          tags: { type: array, items: { type: string, minLength: 1 } }
          createdAt: { type: string, format: date-time }
          updatedAt: { type: string, format: date-time }
    description: >-
      アプリ起動時（初期化処理呼び出し時）に localStorage から読み込んだ TodoItem 配列。
      保存データが存在しない場合は空配列を返す。保存データの JSON パースに失敗した場合も
      利用不能として扱わず、空配列にフォールバックして STORAGE_DATA_CORRUPTED を報告する
      （error_cases 参照）。
    example: []

side_effects:
  - "ブラウザの localStorage への書き込み（todo_list_to_persist が渡されるたび）"

error_cases:
  - code: "STORAGE_UNAVAILABLE"
    condition: "localStorage が無効化されている、またはプライベートブラウジング等の制約で利用できない"
    response_shape:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
  - code: "STORAGE_QUOTA_EXCEEDED"
    condition: "保存しようとしたデータがブラウザのストレージ容量上限を超えた"
    response_shape:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
  - code: "STORAGE_DATA_CORRUPTED"
    condition: "保存済みデータの JSON パースに失敗した（手動改変や旧フォーマット等）"
    response_shape:
      type: object
      properties:
        code: { type: string }
        message: { type: string }

tech_stack:
  language: "TypeScript"
  framework: ""
  libraries:
    - name: "vitest"
      version: "^4.1.0"
      license: "MIT"
      notes: "単体テスト用（devDependency）。MIT・週次DL多数・2026年8月時点で活発にメンテナンスされている。"
    - name: "jsdom"
      version: "^28.0.0"
      license: "MIT"
      notes: "テスト環境で window.localStorage をシミュレートするため（devDependency）。MIT・活発にメンテナンスされている。"

non_functional:
  performance: "読み込み・保存とも同期APIで即時完了すること（初回表示3秒以内の要件に寄与）"
  compatibility: "モダンブラウザ（Chrome/Edge/Firefox/Safari最新版）の localStorage 実装を前提とする"

test_strategy: >-
  jsdom環境でのvitestによる単体テスト。保存→読み込みの往復一致、空データ時の初期化、
  STORAGE_UNAVAILABLE（localStorageアクセスを例外にするモック）、
  STORAGE_DATA_CORRUPTED（不正なJSON文字列を事前に格納した状態からの読み込み）を検証する。

created_at: "2026-08-19T00:00:00Z"
approved_at: null
approved_by: null
