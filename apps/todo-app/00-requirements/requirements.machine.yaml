# schema: harness/schemas/requirements.schema.json
# 人間向けの requirements.md と内容を一致させること
app_id: "todo-app"
app_name: "TODOアプリ"
version: 1
status: APPROVED
summary: >-
  個人が日々のタスクを管理するためのシンプルなTODO管理Webアプリケーション。
  タスクの追加・編集・削除・完了管理を行い、期限・優先度・カテゴリによる整理を可能にする。
  サーバーやアカウント登録を必要とせず、ブラウザ単体で完結する。
goals:
  - タスクをすばやく追加・編集・削除できる
  - タスクの完了状態を管理できる
  - 期限・優先度・カテゴリでタスクを整理できる
  - サーバーやアカウント登録なしに、ブラウザだけで使い始められる
non_goals:
  - 複数ユーザーでのタスク共有・アサイン機能は提供しない
  - リアルタイム共同編集は提供しない
  - モバイルネイティブアプリの提供は行わない（レスポンシブWebで対応）
  - プッシュ通知・リマインダー機能は初期スコープ外
  - 他サービス（カレンダー等）との連携は初期スコープ外
target_users:
  - 個人で日々のタスクを管理したい単一ユーザー（ログイン機能なし、ブラウザ単位でデータを保持）
functional_requirements:
  - id: FR-1
    title: タスクの追加
    description: ユーザーはタイトルを入力して新しいタスクを追加できる
    priority: MUST
    acceptance_criteria:
      - タイトルを入力して追加操作をすると、一覧に新しいタスクが未完了状態で表示される
      - タイトルが空の場合は追加できない
  - id: FR-2
    title: タスク一覧の表示
    description: 登録済みのタスクを一覧表示する
    priority: MUST
    acceptance_criteria:
      - 登録済みの全タスクがタイトル・完了状態とともに一覧表示される
  - id: FR-3
    title: 完了状態の切り替え
    description: タスクを完了/未完了の間で切り替えられる
    priority: MUST
    acceptance_criteria:
      - チェック操作でタスクの完了状態がトグルされ、一覧表示に反映される
  - id: FR-4
    title: タスクの編集
    description: 既存タスクのタイトル・期限・優先度・カテゴリを編集できる
    priority: MUST
    acceptance_criteria:
      - タスクを選択して編集し、保存すると一覧に変更内容が反映される
      - タイトルを空にして保存はできない
  - id: FR-5
    title: タスクの削除
    description: 不要になったタスクを削除できる
    priority: MUST
    acceptance_criteria:
      - 削除操作をしたタスクは一覧から消え、再読み込みしても復活しない
  - id: FR-6
    title: 期限の設定
    description: タスクに期限日を設定・表示できる
    priority: MUST
    acceptance_criteria:
      - タスク作成・編集時に期限日を設定できる
      - 期限が過ぎた未完了タスクが一覧上で視覚的に区別される
  - id: FR-7
    title: 優先度の設定
    description: タスクに優先度（高・中・低）を設定・表示できる
    priority: MUST
    acceptance_criteria:
      - タスク作成・編集時に優先度を高・中・低から選択できる
      - 一覧で優先度が視覚的に区別できる
  - id: FR-8
    title: カテゴリ/タグ付け
    description: タスクにカテゴリまたはタグを付与できる
    priority: MUST
    acceptance_criteria:
      - タスク作成・編集時に自由入力のカテゴリ/タグを1つ以上設定できる
  - id: FR-9
    title: 絞り込み・並び替え
    description: 完了状態・期限・優先度でタスクを絞り込み・並び替えできる
    priority: SHOULD
    acceptance_criteria:
      - 完了/未完了でフィルタできる
      - 期限順・優先度順で並び替えできる
  - id: FR-10
    title: データの永続化
    description: 登録したタスクはブラウザを閉じたり再読み込みしても保持される
    priority: MUST
    acceptance_criteria:
      - ページを再読み込みしても、追加・編集・削除・完了状態の変更が保持されている
non_functional_requirements:
  - category: アーキテクチャ
    description: クライアントサイドのみで動作し、サーバーやアカウント登録は不要とする
  - category: 互換性
    description: モダンブラウザ（Chrome / Edge / Firefox / Safari の最新版）で動作すること
  - category: ユーザビリティ
    description: レスポンシブデザインとし、PCとスマートフォンの両方から利用できること
  - category: 性能
    description: 初回表示は概ね3秒以内を目安とする
constraints:
  - データはブラウザのローカルストレージ（端末・ブラウザ単位）に保存し、v1ではサーバー・DBを持たない
  - 認証・アカウント機能は持たない
  - 端末・ブラウザをまたいだデータ同期は行わない
open_questions: []
approved_by: "studio.yukidaruma@gmail.com"
approved_at: "2026-08-19T12:36:54Z"
